<style>
/* ── the link-in-bio page: one card, five big buttons ─────────────── */
.lk{
  min-block-size:100dvh;
  display:grid;
  place-items:center;
  padding:clamp(18px,4vw,40px) 16px;
  background:
    radial-gradient(60% 40% at 15% 10%, var(--rose-soft) 0%, transparent 70%),
    radial-gradient(50% 35% at 90% 90%, var(--gold-soft) 0%, transparent 70%),
    var(--bg);
}
.lk-card{
  inline-size:min(100%,460px);
  display:grid;
  gap:18px;
  text-align:center;
}
.lk-brand{ display:grid; justify-items:center; gap:6px; }
.lk-mark{
  inline-size:64px; block-size:64px; border-radius:999px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--rose-soft); color:var(--rose-3);
  box-shadow:0 10px 30px -14px var(--rose-2);
}
.lk-name{ font-size:1.7rem; font-weight:800; line-height:1.2; margin:0; }
.lk-tag{ color:var(--ink-2); margin:0; font-size:.95rem; }
.lk-lead{ margin:0; color:var(--ink-2); font-size:.92rem; line-height:1.7; }
.lk-links{ display:grid; gap:10px; }
.lk-btn{
  display:flex; align-items:center; gap:14px;
  min-block-size:64px; padding:12px 16px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--bg-2);
  color:var(--ink);
  text-decoration:none;
  text-align:start;
  transition:transform var(--dur-2), box-shadow var(--dur-2), border-color var(--dur-2);
}
.lk-btn:hover,.lk-btn:focus-visible{
  transform:translateY(-2px);
  border-color:var(--rose);
  box-shadow:0 12px 30px -18px var(--rose-2);
}
.lk-btn .lk-ico{
  flex:0 0 auto; inline-size:42px; block-size:42px; border-radius:14px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--rose-soft); color:var(--rose-3);
}
.lk-btn .lk-txt{ display:grid; gap:2px; min-inline-size:0; }
.lk-btn .lk-t{ font-weight:800; }
.lk-btn .lk-s{ font-size:.82rem; color:var(--ink-2); }
.lk-pri{ background:var(--rose); border-color:var(--rose); color:var(--on-rose); }
.lk-pri .lk-ico{ background:rgba(255,255,255,.22); color:var(--on-rose); }
.lk-pri .lk-s{ color:var(--on-rose); opacity:.9; }
.lk-off{
  padding:12px 14px; border-radius:16px;
  background:linear-gradient(135deg,var(--gold-soft),var(--rose-soft));
  border:1px solid var(--line);
  font-size:.9rem; line-height:1.7; color:var(--ink);
}
.lk-foot{ margin:0; font-size:.82rem; color:var(--ink-3); line-height:1.7; }
.lk-lang{ display:flex; justify-content:center; gap:8px; }
</style>
